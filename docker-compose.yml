services:
  redis:
    image: redis:7-alpine
    env_file:
      - .env.local
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --save 60 1000 --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    image: iom4-web:latest
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: iom4-bot:latest
    env_file:
      - .env.local
    environment:
      WHATSAPP_CHROMIUM_PATH: /usr/bin/chromium
    volumes:
      - bot_auth:/app/.wwebjs_auth
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bot_auth:
  redis_data:
