services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env.local
    environment:
      WHATSAPP_CHROMIUM_PATH: /usr/bin/chromium
    volumes:
      - bot_auth:/app/.wwebjs_auth
    restart: unless-stopped

volumes:
  bot_auth:
