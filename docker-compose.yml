services:
  redis:
    image: redis:7-alpine
    env_file:
      - .env.local
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --save 60 1000 --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iom4}
      POSTGRES_USER: ${POSTGRES_USER:-iom4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iom4_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}
        NEXT_PUBLIC_DISABLE_SSO: ${NEXT_PUBLIC_DISABLE_SSO}
        KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
        KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}
        KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
        SSO_ALLOWED_ROLES: ${SSO_ALLOWED_ROLES}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    image: iom4-web:latest
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://iom4:iom4_password@postgres:5432/iom4}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://minio:9000}
      WHATSAPP_ORCHESTRATOR_ENABLED: ${WHATSAPP_ORCHESTRATOR_ENABLED:-false}
      WHATSAPP_ORCHESTRATOR_BASE_URL: ${WHATSAPP_ORCHESTRATOR_BASE_URL:-http://orchestrator:3099}
      WHATSAPP_ORCHESTRATOR_TOKEN: ${WHATSAPP_ORCHESTRATOR_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./secret/x.com_cookies.txt:/app/secrets/x-cookies.txt:ro

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: iom4-bot:latest
    env_file:
      - .env.local
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://iom4:iom4_password@postgres:5432/iom4}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WHATSAPP_CHROMIUM_PATH: /usr/bin/chromium
    volumes:
      - bot_auth:/app/.wwebjs_auth
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    image: iom4-orchestrator:latest
    env_file:
      - .env.local
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WHATSAPP_ORCHESTRATOR_PORT: 3099
      WHATSAPP_ORCHESTRATOR_MAX_CONTAINERS: ${WHATSAPP_ORCHESTRATOR_MAX_CONTAINERS:-3}
      WHATSAPP_ORCHESTRATOR_START_COOLDOWN_MS: ${WHATSAPP_ORCHESTRATOR_START_COOLDOWN_MS:-30000}
      WHATSAPP_ORCHESTRATOR_RESTART_COOLDOWN_MS: ${WHATSAPP_ORCHESTRATOR_RESTART_COOLDOWN_MS:-60000}
      WHATSAPP_BOT_IMAGE: ${WHATSAPP_BOT_IMAGE:-iom4-bot:latest}
      WHATSAPP_BOT_NETWORK: ${WHATSAPP_BOT_NETWORK:-if3250_k02_g10_iom4_default}
      WHATSAPP_BOT_MEMORY_LIMIT: ${WHATSAPP_BOT_MEMORY_LIMIT:-768m}
      WHATSAPP_BOT_CPUS: ${WHATSAPP_BOT_CPUS:-1}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bot_auth:
  minio_data:
  postgres_data:
  redis_data:
