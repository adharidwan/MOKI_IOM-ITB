stages:
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  tags:
    - proxmox
  variables:
    DOCKER_BUILDKIT: "1"
    COMPOSE_DOCKER_CLI_BUILD: "1"
    DEPLOY_ENV_FILE: "/home/ppl/IF3250_K02_G10_IOM4/.env.local"
  script:
    - test -f "$DEPLOY_ENV_FILE"
    - cp "$DEPLOY_ENV_FILE" "$CI_PROJECT_DIR/.env.local"
    - |
      for key in \
        POSTGRES_DB \
        POSTGRES_USER \
        POSTGRES_PASSWORD \
        DATABASE_URL_DOCKER \
        REDIS_PASSWORD \
        REDIS_URL \
        MINIO_ROOT_USER \
        MINIO_ROOT_PASSWORD \
        S3_ENDPOINT_DOCKER \
        S3_ACCESS_KEY_ID \
        S3_SECRET_ACCESS_KEY \
        S3_BUCKET \
        S3_REGION \
        S3_FORCE_PATH_STYLE \
        NEXT_PUBLIC_DISABLE_SSO \
        WHATSAPP_ORCHESTRATOR_ENABLED \
        WHATSAPP_ORCHESTRATOR_BASE_URL \
        WHATSAPP_ORCHESTRATOR_TOKEN \
        WHATSAPP_BOT_IMAGE \
        WHATSAPP_BOT_NETWORK; do
        if ! grep -q "^${key}=" "$CI_PROJECT_DIR/.env.local"; then
          echo "Missing required env var in $DEPLOY_ENV_FILE: ${key}"
          exit 1
        fi
      done
    - docker compose --env-file "$CI_PROJECT_DIR/.env.local" -f "$CI_PROJECT_DIR/docker-compose.yml" config --quiet
    - docker compose --env-file "$CI_PROJECT_DIR/.env.local" -f "$CI_PROJECT_DIR/docker-compose.yml" build
    - docker compose --env-file "$CI_PROJECT_DIR/.env.local" -f "$CI_PROJECT_DIR/docker-compose.yml" up -d --remove-orphans postgres minio redis web orchestrator
    - docker compose --env-file "$CI_PROJECT_DIR/.env.local" -f "$CI_PROJECT_DIR/docker-compose.yml" ps
    - docker image prune -f
  after_script:
    - docker builder prune -f --filter "until=24h"
