stages:
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  tags:
    - proxmox
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - cp /home/ppl/IF3250_K02_G10_IOM4/.env.local $CI_PROJECT_DIR/.env.local
    - grep -q '^REDIS_PASSWORD=' $CI_PROJECT_DIR/.env.local
    - grep -q '^REDIS_URL=' $CI_PROJECT_DIR/.env.local
    - docker compose --env-file $CI_PROJECT_DIR/.env.local -f $CI_PROJECT_DIR/docker-compose.yml down
    - docker compose --env-file $CI_PROJECT_DIR/.env.local -f $CI_PROJECT_DIR/docker-compose.yml build
        --build-arg NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
        --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
        --build-arg SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
    - docker compose --env-file $CI_PROJECT_DIR/.env.local -f $CI_PROJECT_DIR/docker-compose.yml up -d redis
    - docker compose --env-file $CI_PROJECT_DIR/.env.local -f $CI_PROJECT_DIR/docker-compose.yml up -d web bot orchestrator
    - docker image prune -f
  after_script:
    - docker builder prune -f --filter "until=24h"
